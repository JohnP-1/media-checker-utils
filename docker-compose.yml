services:
  media-ingest:
    image: ghcr.io/johnp-1/media-checker-utils:latest
    container_name: media-ingest
    restart: unless-stopped
    # Must be a user that can read/write the ingest, failed and library folders.
    # Check on the host with:  ls -ln /mnt/storage/ingest /mnt/storage/files/media
    user: "1000:1000"
    env_file: .env            # contains API_KEY=<your TMDB key>
    environment:
      TZ: Europe/London
    command: ["python", "-m", "src.ingest_media", "--loop", "--interval", "900", "--settle", "300"]
    stop_grace_period: 30s    # SIGTERM cleans up any in-flight .partial copy
    volumes:
      # Same paths as the host so the script's constants need no changes.
      # ingest/, failed/, the log and the lock all live under this one mount,
      # which keeps ingest -> failed an instant rename.
      - /mnt/storage/ingest:/mnt/storage/ingest
      # The media library is a separate ZFS dataset (cross-dataset moves use copy + rename).
      - /mnt/storage/files/media/movies:/mnt/storage/files/media/movies
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"